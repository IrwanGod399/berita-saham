<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Berita Saham</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#ddd; --chip:#eee; --link:#0b57d0; --warn:#9a3b00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#eaeaea; --muted:#9a9a9a; --line:#333; --chip:#2a2a2a; --link:#8ab4f8; --warn:#ffb27a; }
  }
  body { margin:0 auto; max-width:860px; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .kontrol { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .kontrol input, .kontrol select { font:inherit; padding:6px 8px; border:1px solid var(--line);
         border-radius:4px; background:var(--bg); color:var(--fg); }
  .kontrol input[type=search] { flex:1 1 200px; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:4px;
           background:var(--bg); color:var(--fg); cursor:pointer; }
  .status { font-size:13px; color:var(--muted); margin-bottom:12px; }
  .status .gagal { color:var(--warn); }
  .item { padding:12px 0; border-top:1px solid var(--line); }
  .item a.judul { color:var(--link); font-weight:600; text-decoration:none; }
  .item a.judul:hover { text-decoration:underline; }
  .info { font-size:13px; color:var(--muted); margin:2px 0; }
  .ringkas { margin:4px 0 0; }
  .chip { display:inline-block; background:var(--chip); border-radius:3px; padding:0 6px; margin:0 4px 2px 0; font-size:12px; }
  .kosong { color:var(--muted); padding:24px 0; }
</style>
</head>
<body>
<h1>Berita Saham Indonesia</h1>
<div class="meta" id="meta">Memuat...</div>

<div class="kontrol">
  <input type="search" id="cari" placeholder="Cari judul atau kode saham">
  <select id="kategori">
    <option value="">Semua kategori</option>
    <option value="suntikan_dana">Suntikan dana</option>
    <option value="akuisisi_merger">Akuisisi / merger</option>
    <option value="dividen_buyback">Dividen / buyback</option>
    <option value="aksi_bursa">Aksi bursa</option>
    <option value="manajemen_kinerja">Manajemen &amp; kinerja</option>
  </select>
  <select id="sumber"><option value="">Semua sumber</option></select>
  <select id="jam">
    <option value="30">30 jam terakhir</option>
    <option value="48">48 jam</option>
    <option value="72">72 jam</option>
  </select>
  <button id="muat" type="button">Muat ulang</button>
</div>

<div class="status" id="status"></div>
<div id="daftar"></div>

<script>
(function () {
  var data = null;
  var el = function (id) { return document.getElementById(id); };
  var NAMA_KATEGORI = {
    suntikan_dana: 'Suntikan dana', akuisisi_merger: 'Akuisisi/merger',
    dividen_buyback: 'Dividen/buyback', aksi_bursa: 'Aksi bursa', manajemen_kinerja: 'Manajemen & kinerja'
  };

  function aman(url) { return /^https?:\/\//i.test(url) ? url : '#'; }

  function buat(tag, kelas, teks) {
    var n = document.createElement(tag);
    if (kelas) n.className = kelas;
    if (teks != null) n.textContent = teks;
    return n;
  }

  function render() {
    var q = el('cari').value.trim().toLowerCase();
    var kat = el('kategori').value;
    var sum = el('sumber').value;
    var daftar = el('daftar');
    daftar.textContent = '';
    if (!data) return;

    var hasil = data.berita.filter(function (b) {
      if (kat && b.petunjuk_kategori.indexOf(kat) === -1) return false;
      if (sum && b.sumber !== sum && !b.sumber_lain.some(function (s) { return s.sumber === sum; })) return false;
      if (q) {
        var tumpuk = (b.judul + ' ' + b.ringkasan + ' ' + b.saham.join(' ')).toLowerCase();
        if (tumpuk.indexOf(q) === -1) return false;
      }
      return true;
    });

    if (hasil.length === 0) { daftar.appendChild(buat('div', 'kosong', 'Tidak ada berita yang cocok.')); return; }

    hasil.forEach(function (b) {
      var d = buat('div', 'item');
      var a = buat('a', 'judul', b.judul);
      a.href = aman(b.url); a.target = '_blank'; a.rel = 'noopener noreferrer';
      d.appendChild(a);

      var info = (b.sumber || '') + (b.waktu_wib ? ' · ' + b.waktu_wib : '');
      if (b.jumlah_sumber > 1) info += ' · ' + b.jumlah_sumber + ' sumber';
      info += ' · skor awal ' + b.prioritas_awal;
      d.appendChild(buat('div', 'info', info));

      var chips = buat('div');
      b.saham.forEach(function (s) { chips.appendChild(buat('span', 'chip', s)); });
      b.petunjuk_kategori.forEach(function (k) { chips.appendChild(buat('span', 'chip', NAMA_KATEGORI[k] || k)); });
      if (b.resmi_idx) chips.appendChild(buat('span', 'chip', 'Pengumuman resmi IDX'));
      if (chips.childNodes.length) d.appendChild(chips);

      if (b.ringkasan) d.appendChild(buat('p', 'ringkas', b.ringkasan));
      daftar.appendChild(d);
    });
  }

  function isiSumber() {
    var pilih = el('sumber');
    var sekarang = pilih.value;
    pilih.textContent = '';
    var semua = buat('option', null, 'Semua sumber'); semua.value = '';
    pilih.appendChild(semua);
    var set = {};
    data.berita.forEach(function (b) {
      set[b.sumber] = true;
      b.sumber_lain.forEach(function (s) { set[s.sumber] = true; });
    });
    Object.keys(set).sort().forEach(function (nama) {
      var o = buat('option', null, nama); o.value = nama; pilih.appendChild(o);
    });
    pilih.value = sekarang;
  }

  function muat() {
    el('meta').textContent = 'Memuat...';
    fetch('/api/news?jam=' + encodeURIComponent(el('jam').value))
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        data = j;
        el('meta').textContent = 'Diperbarui ' + j.dibuat_wib + ' · ' + j.jumlah_ditampilkan + ' berita dari ' +
          j.jumlah_diambil + ' yang diambil (jendela ' + j.jendela_jam + ' jam). Urut: paling berpotensi di atas.';
        var st = el('status'); st.textContent = 'Sumber: ';
        j.sumber_status.forEach(function (s, i) {
          if (i) st.appendChild(document.createTextNode(', '));
          var t = s.status === 'ok' ? s.nama + ' (' + s.jumlah + ')' : s.nama + ' gagal: ' + s.pesan;
          st.appendChild(buat('span', s.status === 'ok' ? '' : 'gagal', t));
        });
        isiSumber(); render();
      })
      .catch(function (e) { el('meta').textContent = 'Gagal memuat: ' + e.message; });
  }

  ['cari', 'kategori', 'sumber'].forEach(function (id) { el(id).addEventListener('input', render); });
  el('jam').addEventListener('change', muat);
  el('muat').addEventListener('click', muat);
  muat();
})();
</script>
</body>
</html>
